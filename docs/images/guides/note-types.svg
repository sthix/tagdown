<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc">
<title id="title">A template creates a typed note and a link connects its author</title><desc id="desc">The Book Template supplies fields to a new Dune note. Choosing Frank Herbert for its author creates a wikilink, and Dune appears in the author note’s linked mentions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#6854aa" stroke-width="1.5"/></marker></defs>
<rect width="960" height="530" rx="16" fill="#f8f9f5"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="32" y="35" fill="#62685e" font-size="16" font-weight="700">TAGDOWN / VISUAL GUIDE</text><text x="32" y="76" fill="#30342f" font-size="30" font-weight="650">Templates give new notes a starting point</text><text x="32" y="109" fill="#62685e" font-size="19" font-weight="400">Example: a Book has an author field that links to a Person.</text><text x="32" y="154" fill="#62685e" font-size="16" font-weight="700">1 / DEFINE THE TEMPLATE</text><text x="510" y="154" fill="#62685e" font-size="16" font-weight="700">2 / CREATE A BOOK</text><rect x="32" y="172" width="418" height="182" rx="12" fill="#fff" stroke="#dce0d5"/><text x="52" y="207" fill="#30342f" font-size="24" font-weight="650">Book Template</text><text x="52" y="244" fill="#30342f" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">author: &quot;[[Person]]&quot;</text><text x="52" y="276" fill="#30342f" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">rating: 0</text><text x="52" y="308" fill="#30342f" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">started: &quot;{{date}}&quot;</text><path d="M 464 263 L 494 263" fill="none" stroke="#6854aa" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="510" y="172" width="418" height="182" rx="12" fill="#fff" stroke="#dce0d5"/><text x="530" y="207" fill="#30342f" font-size="24" font-weight="650">Dune</text><text x="530" y="244" fill="#30342f" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">type: Book</text><text x="530" y="276" fill="#30342f" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">author: &quot;[[Frank Herbert]]&quot;</text><text x="530" y="308" fill="#30342f" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">started: 2026-10-18</text><path d="M 719 362 L 719 399" fill="none" stroke="#6854aa" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="510" y="410" width="418" height="88" rx="12" fill="#edf5ee" stroke="#dce0d5"/><text x="530" y="443" fill="#30342f" font-size="23" font-weight="650">Frank Herbert</text><text x="530" y="478" fill="#286548" font-size="19" font-weight="400">Linked mentions → Book → Dune</text><text x="52" y="409" fill="#30342f" font-size="20" font-weight="400">The template asks for a Person.</text><text x="52" y="443" fill="#30342f" font-size="20" font-weight="400">Choose or create one in the field.</text><text x="52" y="477" fill="#62685e" font-size="19" font-weight="400">The saved value is an ordinary link.</text></g>
</svg>
