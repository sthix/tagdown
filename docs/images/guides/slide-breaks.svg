<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Slide breaks map a note to three slides</title><desc id="desc">The quarterly review example contains two standalone lines of three hyphens. They divide the title, highlights, and next steps into three slides.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#6854aa" stroke-width="1.5"/></marker></defs>
<rect width="960" height="560" rx="16" fill="#f8f9f5"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="32" y="35" fill="#62685e" font-size="16" font-weight="700">TAGDOWN / VISUAL GUIDE</text><text x="32" y="76" fill="#30342f" font-size="30" font-weight="650">A line of three hyphens starts a new slide</text><text x="32" y="109" fill="#62685e" font-size="19" font-weight="400">The note stays one file. Presenting it turns each section into a slide.</text><text x="32" y="154" fill="#62685e" font-size="16" font-weight="700">ONE NOTE / SOURCE</text><text x="510" y="154" fill="#62685e" font-size="16" font-weight="700">THREE SLIDES / ILLUSTRATION</text><rect x="32" y="173" width="418" height="352" rx="12" fill="#fff" stroke="#dce0d5"/><text x="52" y="207" fill="#30342f" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace"># Quarterly review</text><text x="52" y="239" fill="#30342f" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">Where we are</text><rect x="52" y="255" width="67" height="34" rx="12" fill="#eee9fa" stroke="#eee9fa"/><text x="64" y="278" fill="#6854aa" font-size="17" font-weight="600">---</text><text x="52" y="315" fill="#30342f" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">## Highlights</text><text x="52" y="347" fill="#30342f" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">- Shipped search</text><text x="52" y="379" fill="#30342f" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">- Doubled users</text><rect x="52" y="395" width="67" height="34" rx="12" fill="#eee9fa" stroke="#eee9fa"/><text x="64" y="418" fill="#6854aa" font-size="17" font-weight="600">---</text><text x="52" y="455" fill="#30342f" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">## Next</text><text x="52" y="487" fill="#30342f" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">&lt;query tag:roadmap</text><text x="52" y="519" fill="#30342f" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">       show:tasks /&gt;</text><path d="M 464 221 L 494 221" fill="none" stroke="#6854aa" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 464 349 L 494 349" fill="none" stroke="#6854aa" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 464 477 L 494 477" fill="none" stroke="#6854aa" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="510" y="173" width="418" height="104" rx="12" fill="#eee9fa" stroke="#dce0d5"/><text x="528" y="200" fill="#62685e" font-size="16" font-weight="700">1</text><text x="557" y="229" fill="#30342f" font-size="27" font-weight="650">Quarterly review</text><text x="557" y="257" fill="#30342f" font-size="18" font-weight="400">Where we are</text><rect x="510" y="297" width="418" height="104" rx="12" fill="#fff" stroke="#dce0d5"/><text x="528" y="324" fill="#62685e" font-size="16" font-weight="700">2</text><text x="557" y="333" fill="#30342f" font-size="25" font-weight="650">Highlights</text><text x="557" y="360" fill="#30342f" font-size="18" font-weight="400">• Shipped search</text><text x="557" y="387" fill="#30342f" font-size="18" font-weight="400">• Doubled users</text><rect x="510" y="421" width="418" height="104" rx="12" fill="#fff" stroke="#dce0d5"/><text x="528" y="448" fill="#62685e" font-size="16" font-weight="700">3</text><text x="557" y="462" fill="#30342f" font-size="25" font-weight="650">Next</text><text x="557" y="498" fill="#62685e" font-size="18" font-weight="400">Query results at presentation time</text></g>
</svg>
