<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!--
      Document-wide referrer policy. Tauri serves the app from a non-HTTPS
      scheme (tauri://localhost on macOS) and the default policy would suppress
      the Referer header on cross-origin requests to HTTPS. Embedded video
      players (YouTube, Vimeo) require a non-empty Referer for playback
      validation; without it YouTube returns Error 153.
    -->
    <meta name="referrer" content="origin" />
    <title>Tagdown Editor</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
