# GitHub Pages site for the docs: https://sthix.github.io/tagdown/
# GitHub builds it from main /docs. Markdown stays readable on github.com;
# the local layout and navigation data provide the documentation site.
title: Tagdown
description: A fast, local-first desktop editor for Tagdown notes.
baseurl: /tagdown
url: https://sthix.github.io

plugins:
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-relative-links
  - jekyll-readme-index

titles_from_headings:
  enabled: true
  strip_title: false
  collections: false

relative_links:
  enabled: true

exclude:
  - Gemfile
  - Gemfile.lock

defaults:
  - scope: { path: "" }
    values: { layout: default }
  - scope: { path: "README.md" }
    values: { nav_order: 1, title: Welcome to Tagdown, home: true }
  - scope: { path: "getting-started.md" }
    values: { nav_order: 2 }
  - scope: { path: "writing-notes.md" }
    values: { nav_order: 3 }
  - scope: { path: "syntax.md" }
    values: { nav_order: 4 }
  - scope: { path: "organizing.md" }
    values: { nav_order: 5 }
  - scope: { path: "journal.md" }
    values: { nav_order: 6 }
  - scope: { path: "queries-and-tasks.md" }
    values: { nav_order: 7 }
  - scope: { path: "version-history.md" }
    values: { nav_order: 8 }
  - scope: { path: "sharing.md" }
    values: { nav_order: 9 }
  - scope: { path: "cli-and-mcp.md" }
    values: { nav_order: 10 }
  - scope: { path: "keyboard-shortcuts.md" }
    values: { nav_order: 11 }
  - scope: { path: "development.md" }
    values: { nav_order: 12 }
