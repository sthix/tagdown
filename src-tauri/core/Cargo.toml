[package]
name = "tagdown-core"
version = "0.1.0"
description = "Tagdown vault: notes, search, links, and version history. Also the `tagdown` CLI and MCP server."
edition = "2021"
rust-version = "1.86"

[lib]
name = "tagdown_core"

[[bin]]
name = "tagdown"
path = "src/bin/tagdown.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
notify = "8"
tantivy = "0.26.1"
