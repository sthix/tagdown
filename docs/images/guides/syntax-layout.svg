<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Columns and tabs from plain text</title><desc id="desc">A grid separates two columns with three vertical bars. A tabs block names each tab and holds its content.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#6854aa" stroke-width="1.5"/></marker></defs>
<rect width="960" height="560" rx="16" fill="#f8f9f5"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="32" y="35" fill="#62685e" font-size="16" font-weight="700">TAGDOWN / VISUAL GUIDE</text><text x="32" y="76" fill="#30342f" font-size="30" font-weight="650">Turn a long note into smaller spaces</text><text x="32" y="109" fill="#62685e" font-size="19" font-weight="400">These sketches show the structure of the rendered components.</text><text x="32" y="151" fill="#62685e" font-size="16" font-weight="700">SOURCE</text><text x="510" y="151" fill="#62685e" font-size="16" font-weight="700">PREVIEW / ILLUSTRATION</text><rect x="32" y="170" width="418" height="176" rx="12" fill="#fff" stroke="#dce0d5"/><text x="52" y="201" fill="#30342f" font-size="18" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">&lt;grid 2&gt;</text><text x="52" y="233" fill="#30342f" font-size="18" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">Left column.</text><text x="52" y="265" fill="#30342f" font-size="18" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">|||</text><text x="52" y="297" fill="#30342f" font-size="18" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">Right column.</text><text x="52" y="329" fill="#30342f" font-size="18" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">&lt;/grid&gt;</text><path d="M 464 258 L 494 258" fill="none" stroke="#6854aa" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="510" y="170" width="418" height="176" rx="12" fill="#fff" stroke="#dce0d5"/><rect x="530" y="194" width="179" height="126" rx="12" fill="#f3f5ee" stroke="#dce0d5"/><rect x="729" y="194" width="179" height="126" rx="12" fill="#f3f5ee" stroke="#dce0d5"/><text x="546" y="248" fill="#30342f" font-size="20" font-weight="400">Left column.</text><text x="745" y="248" fill="#30342f" font-size="20" font-weight="400">Right column.</text><rect x="32" y="366" width="418" height="160" rx="12" fill="#fff" stroke="#dce0d5"/><text x="52" y="400" fill="#30342f" font-size="17" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">&lt;tabs&gt;</text><text x="52" y="432" fill="#30342f" font-size="17" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">&lt;tab &quot;Source&quot;&gt;The raw text.&lt;/tab&gt;</text><text x="52" y="464" fill="#30342f" font-size="17" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">&lt;tab &quot;Preview&quot;&gt;Rendered.&lt;/tab&gt;</text><text x="52" y="496" fill="#30342f" font-size="17" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">&lt;/tabs&gt;</text><path d="M 464 446 L 494 446" fill="none" stroke="#6854aa" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="510" y="366" width="418" height="160" rx="12" fill="#fff" stroke="#dce0d5"/><rect x="532" y="387" width="98" height="34" rx="12" fill="#eee9fa" stroke="#eee9fa"/><text x="544" y="410" fill="#6854aa" font-size="17" font-weight="600">Source</text><text x="653" y="411" fill="#62685e" font-size="20" font-weight="400">Preview</text><path d="M 532 430 H 906" stroke="#dce0d5"/><text x="534" y="473" fill="#30342f" font-size="20" font-weight="400">The raw text.</text><text x="534" y="506" fill="#62685e" font-size="18" font-weight="400">Choose a tab to show its content.</text></g>
</svg>
