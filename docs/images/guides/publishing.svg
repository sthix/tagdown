<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Publishing turns a chosen set of notes into a static site</title><desc id="desc">Choose all notes, a folder, or a tag, then choose an output folder. Tagdown writes an index, note pages, and assets. Links between published notes remain links; links outside the selection become plain text.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#6854aa" stroke-width="1.5"/></marker></defs>
<rect width="960" height="540" rx="16" fill="#f8f9f5"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="32" y="35" fill="#62685e" font-size="16" font-weight="700">TAGDOWN / VISUAL GUIDE</text><text x="32" y="76" fill="#30342f" font-size="30" font-weight="650">From a selected set of notes to a website</text><text x="32" y="109" fill="#62685e" font-size="19" font-weight="400">Publishing writes a folder of static files. Upload that folder to your host.</text><text x="32" y="153" fill="#62685e" font-size="16" font-weight="700">1 / CHOOSE NOTES</text><text x="510" y="153" fill="#62685e" font-size="16" font-weight="700">2 / WRITE THE SITE FOLDER</text><rect x="32" y="173" width="418" height="137" rx="12" fill="#fff" stroke="#dce0d5"/><text x="52" y="211" fill="#30342f" font-size="23" font-weight="650">All notes, a folder, or a tag</text><text x="52" y="251" fill="#30342f" font-size="20" font-weight="400">Example: the Projects folder</text><text x="52" y="285" fill="#6854aa" font-size="20" font-weight="600">Atlas + Beacon</text><path d="M 464 240 L 494 240" fill="none" stroke="#6854aa" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="510" y="173" width="418" height="137" rx="12" fill="#fff" stroke="#dce0d5"/><text x="530" y="208" fill="#30342f" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">index.html</text><text x="530" y="240" fill="#30342f" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">notes/atlas.html, beacon.html</text><text x="530" y="272" fill="#30342f" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">assets/</text><text x="32" y="357" fill="#62685e" font-size="16" font-weight="700">3 / LINKS FOLLOW THE PUBLISHED SELECTION</text><rect x="32" y="378" width="418" height="125" rx="12" fill="#edf5ee" stroke="#dce0d5"/><text x="52" y="415" fill="#286548" font-size="24" font-weight="650">Atlas → Beacon</text><text x="52" y="451" fill="#30342f" font-size="20" font-weight="400">Both published: a working page link.</text><text x="52" y="480" fill="#62685e" font-size="18" font-weight="400">Queries include published notes only.</text><rect x="510" y="378" width="418" height="125" rx="12" fill="#fff" stroke="#dce0d5"/><text x="530" y="415" fill="#30342f" font-size="24" font-weight="650">Atlas → Weekly planning</text><text x="530" y="451" fill="#30342f" font-size="19" font-weight="400">Weekly planning is outside the selection.</text><text x="530" y="480" fill="#62685e" font-size="18" font-weight="400">The link becomes plain text.</text></g>
</svg>
