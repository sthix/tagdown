<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">A live query gathers tasks from tagged notes</title><desc id="desc">Atlas and Beacon have a project tag and contribute their open tasks. An untagged Shopping note is excluded. Ticking a result updates the task in its original note.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#6854aa" stroke-width="1.5"/></marker></defs>
<rect width="960" height="540" rx="16" fill="#f8f9f5"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="32" y="35" fill="#62685e" font-size="16" font-weight="700">TAGDOWN / VISUAL GUIDE</text><text x="32" y="76" fill="#30342f" font-size="30" font-weight="650">One query, tasks from several notes</text><text x="32" y="109" fill="#62685e" font-size="19" font-weight="400">The dashboard gathers results. Each task still belongs to its original note.</text><text x="32" y="153" fill="#62685e" font-size="16" font-weight="700">NOTES IN THE VAULT</text><text x="510" y="153" fill="#62685e" font-size="16" font-weight="700">DASHBOARD NOTE</text><rect x="32" y="173" width="360" height="97" rx="12" fill="#fff" stroke="#dce0d5"/><text x="52" y="204" fill="#30342f" font-size="23" font-weight="650">Atlas</text><rect x="146" y="183" width="139" height="34" rx="12" fill="#eee9fa" stroke="#eee9fa"/><text x="158" y="206" fill="#6854aa" font-size="17" font-weight="600">#project/atlas</text><text x="52" y="246" fill="#30342f" font-size="20" font-weight="400">☐ Publish the docs</text><rect x="32" y="286" width="360" height="97" rx="12" fill="#fff" stroke="#dce0d5"/><text x="52" y="317" fill="#30342f" font-size="23" font-weight="650">Beacon</text><rect x="146" y="296" width="157" height="34" rx="12" fill="#eee9fa" stroke="#eee9fa"/><text x="158" y="319" fill="#6854aa" font-size="17" font-weight="600">#project/beacon</text><text x="52" y="359" fill="#30342f" font-size="20" font-weight="400">☐ Send the recap</text><rect x="32" y="399" width="360" height="97" rx="12" fill="#f0f1ed" stroke="#dce0d5"/><text x="52" y="433" fill="#62685e" font-size="23" font-weight="650">Shopping</text><text x="52" y="473" fill="#62685e" font-size="20" font-weight="400">No project tag: excluded</text><path d="M 402 222 L 498 281" fill="none" stroke="#6854aa" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 402 335 L 498 310" fill="none" stroke="#6854aa" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="510" y="173" width="418" height="323" rx="12" fill="#fff" stroke="#dce0d5"/><text x="532" y="206" fill="#62685e" font-size="16" font-weight="700">QUERY SOURCE</text><text x="532" y="244" fill="#30342f" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">&lt;query tag:project</text><text x="532" y="276" fill="#30342f" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">       show:tasks /&gt;</text><path d="M 532 299 H 906" stroke="#dce0d5"/><text x="532" y="335" fill="#62685e" font-size="16" font-weight="700">MATCHING OPEN TASKS</text><text x="532" y="375" fill="#30342f" font-size="22" font-weight="400">☐ Publish the docs</text><text x="558" y="402" fill="#62685e" font-size="17" font-weight="400">from Atlas</text><text x="532" y="444" fill="#30342f" font-size="22" font-weight="400">☐ Send the recap</text><text x="558" y="471" fill="#62685e" font-size="17" font-weight="400">from Beacon</text><text x="32" y="526" fill="#6854aa" font-size="19" font-weight="400">Tick a result here → the checkbox in the original note changes too.</text></g>
</svg>
