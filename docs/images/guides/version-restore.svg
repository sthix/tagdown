<svg xmlns="http://www.w3.org/2000/svg" width="960" height="478" viewBox="0 0 960 478" role="img" aria-labelledby="title desc">
<title id="title">Restoring an earlier version preserves the current one</title><desc id="desc">Select an earlier snapshot and restore it. That content becomes current, while the version being replaced is saved to history first and can be restored later.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#6854aa" stroke-width="1.5"/></marker></defs>
<rect width="960" height="478" rx="16" fill="#f8f9f5"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="32" y="35" fill="#62685e" font-size="16" font-weight="700">TAGDOWN / VISUAL GUIDE</text><text x="32" y="76" fill="#30342f" font-size="30" font-weight="650">Restore an earlier version without losing this one</text><text x="32" y="109" fill="#62685e" font-size="19" font-weight="400">The version being replaced goes into history before the selected version returns.</text><text x="32" y="154" fill="#62685e" font-size="16" font-weight="700">BEFORE RESTORE</text><text x="510" y="154" fill="#62685e" font-size="16" font-weight="700">AFTER RESTORE</text><rect x="32" y="173" width="418" height="97" rx="12" fill="#fff" stroke="#dce0d5"/><text x="52" y="207" fill="#30342f" font-size="23" font-weight="650">Current note</text><text x="52" y="244" fill="#30342f" font-size="20" font-weight="400">The latest edits</text><rect x="32" y="295" width="418" height="105" rx="12" fill="#eee9fa" stroke="#d5cceb"/><text x="52" y="332" fill="#6854aa" font-size="23" font-weight="650">Selected snapshot</text><text x="52" y="372" fill="#30342f" font-size="20" font-weight="400">An earlier draft you want back</text><rect x="510" y="173" width="418" height="97" rx="12" fill="#eee9fa" stroke="#d5cceb"/><text x="530" y="207" fill="#6854aa" font-size="23" font-weight="650">Current note</text><text x="530" y="244" fill="#30342f" font-size="20" font-weight="400">The earlier draft, restored</text><rect x="510" y="295" width="418" height="105" rx="12" fill="#fff" stroke="#dce0d5"/><text x="530" y="332" fill="#30342f" font-size="23" font-weight="650">History snapshot</text><text x="530" y="372" fill="#30342f" font-size="20" font-weight="400">The latest edits, kept for you</text><path d="M 450 331 L 510 235" fill="none" stroke="#6854aa" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 450 235 L 510 331" fill="none" stroke="#6854aa" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="32" y="448" fill="#62685e" font-size="20" font-weight="400">To undo a restore, open history again and restore the snapshot of the latest edits.</text></g>
</svg>
