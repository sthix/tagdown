<svg xmlns="http://www.w3.org/2000/svg" width="960" height="428" viewBox="0 0 960 428" role="img" aria-labelledby="title desc">
<title id="title">Completing a weekly task keeps a record and adds the next occurrence</title><desc id="desc">An open weekly task for October 18 becomes a completed task. A new open task dated October 25 is inserted above it.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#6854aa" stroke-width="1.5"/></marker></defs>
<rect width="960" height="428" rx="16" fill="#f8f9f5"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="32" y="35" fill="#62685e" font-size="16" font-weight="700">TAGDOWN / VISUAL GUIDE</text><text x="32" y="76" fill="#30342f" font-size="30" font-weight="650">Finish a repeating task, keep its history</text><text x="32" y="109" fill="#62685e" font-size="19" font-weight="400">A weekly example with an explicit date, so the next day is easy to see.</text><text x="32" y="154" fill="#62685e" font-size="16" font-weight="700">BEFORE / IN THE NOTE</text><rect x="32" y="173" width="896" height="58" rx="12" fill="#fff" stroke="#dce0d5"/><text x="52" y="209" fill="#30342f" font-size="22" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">- [ ] Water plants [[2026-10-18]] every:week</text><path d="M 480 242 L 480 280" fill="none" stroke="#6854aa" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="518" y="245" width="222" height="34" rx="12" fill="#eee9fa" stroke="#eee9fa"/><text x="530" y="268" fill="#6854aa" font-size="17" font-weight="600">Tick the checkbox</text><text x="32" y="308" fill="#62685e" font-size="16" font-weight="700">AFTER / IN THE SAME NOTE</text><rect x="32" y="326" width="896" height="77" rx="12" fill="#fff" stroke="#dce0d5"/><text x="52" y="354" fill="#286548" font-size="22" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">- [ ] Water plants [[2026-10-25]] every:week</text><text x="52" y="386" fill="#62685e" font-size="22" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">- [x] Water plants [[2026-10-18]] every:week</text></g>
</svg>
