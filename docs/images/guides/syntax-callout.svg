<svg xmlns="http://www.w3.org/2000/svg" width="960" height="372" viewBox="0 0 960 372" role="img" aria-labelledby="title desc">
<title id="title">From callout source to preview</title><desc id="desc">A tip block becomes a titled callout. The opening line sets its type and title; the closing line ends it.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#6854aa" stroke-width="1.5"/></marker></defs>
<rect width="960" height="372" rx="16" fill="#f8f9f5"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="32" y="35" fill="#62685e" font-size="16" font-weight="700">TAGDOWN / VISUAL GUIDE</text><text x="32" y="76" fill="#30342f" font-size="30" font-weight="650">A little structure, written as text</text><text x="32" y="109" fill="#62685e" font-size="19" font-weight="400">Callout example: the markers describe the block; the body stays Markdown.</text><text x="32" y="153" fill="#62685e" font-size="16" font-weight="700">SOURCE</text><text x="510" y="153" fill="#62685e" font-size="16" font-weight="700">PREVIEW / ILLUSTRATION</text><rect x="32" y="172" width="418" height="160" rx="12" fill="#fff" stroke="#dce0d5"/><text x="52" y="210" fill="#30342f" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">::: tip Pro tip</text><text x="52" y="242" fill="#30342f" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">Keep **one idea** per note.</text><text x="52" y="274" fill="#30342f" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">:::</text><path d="M 464 251 L 494 251" fill="none" stroke="#6854aa" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="510" y="172" width="418" height="160" rx="12" fill="#eee9fa" stroke="#d5cceb"/><path d="M 511 184 V 320" stroke="#6854aa" stroke-width="4"/><text x="534" y="212" fill="#6854aa" font-size="17" font-weight="700">PRO TIP</text><text x="534" y="255" fill="#30342f" font-size="23">Keep <tspan font-weight="700">one idea</tspan> per note.</text><text x="534" y="294" fill="#62685e" font-size="18" font-weight="400">A titled tip, with a Markdown body.</text></g>
</svg>
