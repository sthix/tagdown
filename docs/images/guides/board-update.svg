<svg xmlns="http://www.w3.org/2000/svg" width="960" height="488" viewBox="0 0 960 488" role="img" aria-labelledby="title desc">
<title id="title">Moving a board card changes the note’s status</title><desc id="desc">A Project board has planned, active, and done lanes. Dragging Atlas from planned to active writes status: active into the Atlas note.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#6854aa" stroke-width="1.5"/></marker></defs>
<rect width="960" height="488" rx="16" fill="#f8f9f5"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="32" y="35" fill="#62685e" font-size="16" font-weight="700">TAGDOWN / VISUAL GUIDE</text><text x="32" y="76" fill="#30342f" font-size="30" font-weight="650">A board is a view of your note properties</text><text x="32" y="109" fill="#62685e" font-size="19" font-weight="400">Illustration: drag Atlas from planned to active to change its status.</text><rect x="32" y="139" width="896" height="55" rx="12" fill="#fff" stroke="#dce0d5"/><text x="50" y="174" fill="#30342f" font-size="21" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">&lt;query type:Project show:board lanes:planned,active,done /&gt;</text><rect x="32" y="218" width="280" height="153" rx="12" fill="#f0f1ed" stroke="#dce0d5"/><rect x="340" y="218" width="280" height="153" rx="12" fill="#eee9fa" stroke="#d5cceb"/><rect x="648" y="218" width="280" height="153" rx="12" fill="#edf5ee" stroke="#dce0d5"/><text x="50" y="249" fill="#62685e" font-size="16" font-weight="700">PLANNED</text><text x="358" y="249" fill="#62685e" font-size="16" font-weight="700">ACTIVE</text><text x="666" y="249" fill="#62685e" font-size="16" font-weight="700">DONE</text><rect x="50" y="270" width="244" height="75" rx="12" fill="#f8f9f5" stroke="#dce0d5"/><text x="68" y="313" fill="#62685e" font-size="22" font-weight="400">Atlas</text><rect x="358" y="270" width="244" height="75" rx="12" fill="#fff" stroke="#dce0d5"/><text x="376" y="313" fill="#30342f" font-size="22" font-weight="650">Atlas</text><path d="M 230 302 L 344 302" fill="none" stroke="#6854aa" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="666" y="270" width="244" height="75" rx="12" fill="#fff" stroke="#dce0d5"/><text x="684" y="313" fill="#30342f" font-size="22" font-weight="400">Beacon</text><path d="M 480 380 L 480 405" fill="none" stroke="#6854aa" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="242" y="417" width="476" height="44" rx="12" fill="#fff" stroke="#dce0d5"/><text x="262" y="447" fill="#30342f" font-size="21" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">Atlas note → status: active</text></g>
</svg>
