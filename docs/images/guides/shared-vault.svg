<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">The desktop app, command line, and MCP server share one local vault</title><desc id="desc">The app uses Tauri commands and an AI assistant uses tagdown mcp. These and the CLI use tagdown-core to read and write the same Markdown files, with version history.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#6854aa" stroke-width="1.5"/></marker></defs>
<rect width="960" height="540" rx="16" fill="#f8f9f5"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="32" y="35" fill="#62685e" font-size="16" font-weight="700">TAGDOWN / VISUAL GUIDE</text><text x="32" y="76" fill="#30342f" font-size="30" font-weight="650">Three ways into the same local vault</text><text x="32" y="109" fill="#62685e" font-size="19" font-weight="400">Use the app, a terminal, or a connected assistant. Your notes stay Markdown files.</text><rect x="32" y="149" width="280" height="115" rx="12" fill="#fff" stroke="#dce0d5"/><text x="52" y="188" fill="#30342f" font-size="24" font-weight="650">Desktop app</text><text x="52" y="228" fill="#62685e" font-size="19" font-weight="400">via Tauri commands</text><rect x="340" y="149" width="280" height="115" rx="12" fill="#fff" stroke="#dce0d5"/><text x="360" y="188" fill="#30342f" font-size="24" font-weight="650">Terminal / scripts</text><text x="360" y="228" fill="#30342f" font-size="18" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">tagdown &lt;command&gt;</text><rect x="648" y="149" width="280" height="115" rx="12" fill="#fff" stroke="#dce0d5"/><text x="668" y="188" fill="#30342f" font-size="24" font-weight="650">AI assistant</text><text x="668" y="228" fill="#30342f" font-size="18" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">via tagdown mcp</text><path d="M 172 273 L 320 317" fill="none" stroke="#6854aa" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 480 273 L 480 317" fill="none" stroke="#6854aa" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 788 273 L 640 317" fill="none" stroke="#6854aa" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="222" y="328" width="516" height="77" rx="12" fill="#eee9fa" stroke="#d5cceb"/><text x="244" y="361" fill="#6854aa" font-size="24" font-weight="650" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">tagdown-core</text><text x="244" y="390" fill="#30342f" font-size="19" font-weight="400">Shared read, write, query, and history logic</text><path d="M 480 415 L 480 444" fill="none" stroke="#6854aa" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="222" y="455" width="516" height="61" rx="12" fill="#fff" stroke="#dce0d5"/><text x="244" y="494" fill="#30342f" font-size="18" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">Vault folder: .md notes + .tagdown/history/</text></g>
</svg>
